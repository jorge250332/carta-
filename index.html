<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Happy Birthday | Mich</title>

	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap"
		rel="stylesheet">

	<!-- Libraries -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Ambient Background -->
	<div class="ambient-bg">
		<div class="cursor-light"></div>
		<div class="orb orb-1"></div>
		<div class="orb orb-2"></div>
		<div class="orb orb-3"></div>
		<div class="particles" id="particles-container"></div>
	</div>

	<!-- Loading Screen -->
	<div id="loader">
		<div class="loader-content">
			<h1 class="reveal-text">Preparing something special...</h1>
			<div class="progress-bar">
				<div class="progress"></div>
			</div>
		</div>
	</div>

	<main class="main-container">
		<div id="card-wrapper">
			<div id="card">
				<!-- Inside of the Card -->
				<div id="card-inside">
					<div class="wrap">
						<div class="inside-content">
							<p class="wish-title">Happy Birthday!</p>
							<div class="wish-text" id="typing-container">
								<p class="typing-line" id="line-1"></p>
								<p class="typing-line" id="line-2"></p>
								<p class="typing-line" id="line-3"></p>
							</div>
							<p class="signed">With all my love, <br><span class="name" id="signature">Jorge</span> <span
									class="heart-icon" id="heart-trigger">❤</span></p>
							<button id="reveal-surprise-btn" class="mini-surprise-btn"
								style="display: none; opacity: 0; transform: translateY(10px);">
								<span>See Final Surprise</span>
								<span class="icon">🎁</span>
							</button>
						</div>
					</div>
				</div>

				<!-- Front of the Card -->
				<div id="card-front">
					<div class="wrap">
						<div class="front-content">
							<h1 class="main-title">Happy <br> Birthday <br> <span class="highlight">Mich</span></h1>
							<div class="cake-container">
								<div class="glass-cake">
								<div class="glass-cake">
									<img src="monocumple.png" alt="Mono de cumpleaños" class="mono-cumple">

									<div class="cake-base"></div>
								</div>
									<div class="cake-base"></div>
								</div>
							</div>
						</div>
					</div>

					<div class="card-controls">
						<button id="open" class="btn-interact">Open Card</button>
						<button id="close" class="btn-interact">Close Card</button>
					</div>

					<!-- Back of the Front Cover (Inside Polaroid) -->
					<div class="card-front_inside">
						<div class="polaroid-wrapper">
							<div class="polaroid">
								<div class="img-frame" style="background-image: url('./img/girl1.jpg')"></div>
								<div class="polaroid-caption">Forever & Always</div>
							</div>
						</div>
						<div class="card-overlay"></div>
					</div>
				</div>
			</div>
		</div>



	<script src="index.js"></script>
</body>

</html>
